<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="ForeverHer: women's beauty and wellness supplements. Clinically dosed collagen, hyaluronic acid, biotin and hormone support, third-party tested.">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>ForeverHer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout concept: Rho-style commerce grid — porcelain page, plum ink, rose accent, editorial serif headlines, pill UI, rounded cards. Single light theme by choice (a beauty storefront). */
:root{
  --bg:#FFFCFA; --paper:#FFFFFF; --surface:#F7EEEE; --surface-2:#FBF6F5;
  --ink:#2A1A2E; --ink-2:#67586B; --ink-3:#A0929F; --line:#EADFE0;
  --accent:#B5485F; --accent-soft:#F7E1E5; --gold:#C9A24D; --gold-soft:#F6E8C3; --sage:#4F8A5B;
  --display:'Instrument Serif',Georgia,'Times New Roman',serif;
  --body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
  --r:20px; --r-s:12px; --max:1240px;
  color-scheme:light;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:80;background:var(--ink)}
a{color:inherit;text-decoration:none}
img,svg{max-width:100%;display:block}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0;text-align:inherit}
input{font:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:4px}
.wrap{max-width:var(--max);margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3,.serif{font-family:var(--display);font-weight:400;line-height:1.02;margin:0;letter-spacing:-.012em}
h1,h2{text-wrap:balance}
h1{font-size:clamp(44px,6vw,76px)}
h2{font-size:clamp(34px,4.2vw,54px)}
h3{font-size:clamp(22px,2.4vw,28px)}
p{margin:0}
.eyebrow{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-2);font-weight:600}
.muted{color:var(--ink-2)}
.small{font-size:13px}
.hide{display:none!important}
.sec{padding-block:clamp(48px,7vw,96px)}
.sec-head{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap;margin-bottom:32px}
.sec-head p{max-width:56ch}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:50px;padding:0 28px;border-radius:999px;background:var(--ink);color:#fff;font-weight:700;font-size:13px;letter-spacing:.1em;text-transform:uppercase;white-space:nowrap;transition:transform .15s,background .15s,box-shadow .15s}
.btn:hover{background:#3a2740;transform:translateY(-1px);box-shadow:0 10px 24px -12px rgba(42,26,46,.5)}
.btn.lg{height:58px;padding:0 36px}
.btn.sm{height:40px;padding:0 18px;font-size:12px}
.btn.outline{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
.btn.outline:hover{background:var(--ink);color:#fff}
.btn.rose{background:var(--accent)}
.btn.rose:hover{background:#9c3a50}
.btn.white{background:#fff;color:var(--ink)}
.btn.white:hover{background:var(--surface)}
.btn.wide{width:100%}
.pill{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:999px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.pill.ink{background:var(--ink);color:#fff}
.pill.gold{background:var(--gold-soft);color:var(--ink)}
.pill.rose{background:var(--accent-soft);color:var(--accent)}
.pill.sage{background:#E3EFE4;color:var(--sage)}
.pill.line{border:1px solid var(--line);color:var(--ink-2);background:#fff}

/* announcement + header */
.announce{background:var(--ink);color:#fff;font-size:11.5px;letter-spacing:.18em;text-transform:uppercase;font-weight:600;text-align:center;padding:10px 16px}
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:70;background:rgba(255,252,250,.92);backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line)}
.hdr-in{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:24px;height:78px}
.logo{font-family:var(--display);font-size:32px;letter-spacing:-.02em;display:inline-flex;align-items:baseline;gap:2px;line-height:1}
.logo em{font-style:italic;color:var(--accent)}
.logo .mark{width:14px;height:14px;align-self:center;margin-left:4px}
.nav{display:flex;gap:4px;align-items:center}
.nav>div{position:relative}
.nav-btn{display:inline-flex;align-items:center;gap:6px;height:42px;padding:0 11px;border-radius:999px;font-weight:500;font-size:14.5px;white-space:nowrap}
@media (max-width:1240px){.quizbtn{display:none}}
.nav-btn:hover{background:var(--surface)}
.nav-btn .chev{width:10px;height:10px;opacity:.6}
.dd{position:absolute;top:100%;left:0;padding-top:10px;display:none;z-index:5}
.nav>div:hover .dd,.nav>div:focus-within .dd{display:block}
.dd-in{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 24px 60px -24px rgba(42,26,46,.35);padding:16px;min-width:280px}
.dd-in.products{min-width:560px;display:grid;grid-template-columns:1fr 1fr;gap:6px}
.dd-item{display:flex;gap:12px;align-items:center;padding:8px 10px;border-radius:12px}
.dd-item:hover{background:var(--surface-2)}
.dd-item .mini{width:44px;height:60px;flex:none}
.dd-item b{display:block;font-weight:600;font-size:14.5px}
.dd-item span{font-size:12.5px;color:var(--ink-2)}
.dd-link{display:block;padding:10px 12px;border-radius:10px;font-weight:500}
.dd-link small{display:block;color:var(--ink-2);font-weight:400;font-size:12.5px}
.dd-link:hover{background:var(--surface-2)}
.dd-foot{grid-column:1/-1;border-top:1px solid var(--line);margin-top:8px;padding-top:12px;display:flex;justify-content:space-between;align-items:center;font-size:14px}
.acts{display:flex;align-items:center;gap:6px}
.icon-btn{width:42px;height:42px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;position:relative}
.icon-btn:hover{background:var(--surface)}
.icon-btn svg{width:21px;height:21px}
.count{position:absolute;top:4px;right:2px;min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--accent);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center}
.burger{display:none}
@media (max-width:1040px){
  .nav,.quizbtn{display:none}
  .burger{display:inline-flex}
  .hdr-in{grid-template-columns:auto 1fr auto;height:68px}
  .logo{font-size:28px}
}

/* mobile menu */
.mnav{position:fixed;inset:0;z-index:90;display:none}
.mnav.open{display:block}
.mnav .scrim{position:absolute;inset:0;background:rgba(42,26,46,.45)}
.mnav .panel{position:absolute;top:0;left:0;bottom:0;width:min(360px,88%);background:#fff;padding:calc(20px + env(safe-area-inset-top,0px)) 22px 40px max(22px,env(safe-area-inset-left,0px));overflow:auto;display:flex;flex-direction:column;gap:6px}
.mnav .panel a{display:block;padding:12px 0;font-family:var(--display);font-size:26px;border-bottom:1px solid var(--line)}
.mnav .panel .sub a{font-family:var(--body);font-size:15px;padding:9px 0 9px 14px;border:0;color:var(--ink-2)}
.mnav .panel .close{align-self:flex-end;margin-bottom:8px}

/* hero */
.hero{display:grid;grid-template-columns:1.05fr 1fr;gap:40px;align-items:center;padding-block:40px 24px}
.hero-copy{display:flex;flex-direction:column;gap:22px;max-width:560px}
.hero h1 em{font-style:italic;color:var(--accent)}
.hero p.lead{font-size:18px;color:var(--ink-2);max-width:46ch}
.badges{display:flex;flex-wrap:wrap;gap:10px}
.badge{display:inline-flex;align-items:center;gap:8px;background:var(--surface);border-radius:12px;padding:10px 14px;font-size:12.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.badge svg{width:16px;height:16px;flex:none}
.hero-cta{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.guar{font-size:12.5px;color:var(--ink-2)}
.tableau{position:relative;border-radius:28px;overflow:hidden;aspect-ratio:1/1.02;background:radial-gradient(120% 90% at 50% 100%,#F3D9DE 0%,#FAF0F0 45%,#FFFFFF 100%)}
.tableau .shelf{position:absolute;left:6%;right:6%;top:70%;height:3px;background:linear-gradient(90deg,transparent,rgba(42,26,46,.18),transparent)}
.tableau .shelf::after{content:"";position:absolute;left:0;right:0;top:3px;height:60px;background:linear-gradient(180deg,rgba(255,255,255,.65),transparent)}
.tableau .stage{position:absolute;left:0;right:0;top:0;height:70%;display:flex;align-items:flex-end;justify-content:center;gap:0;padding:0 8%}
.tableau .stage svg{width:34%;filter:drop-shadow(0 18px 24px rgba(42,26,46,.18))}
.tableau .stage svg.c{width:41%;margin:0 -5%;position:relative;z-index:2}
.tableau .refl{position:absolute;left:0;right:0;top:70%;height:30%;display:flex;align-items:flex-start;justify-content:center;padding:0 8%;transform:scaleY(-1);opacity:.22;-webkit-mask-image:linear-gradient(to top,rgba(0,0,0,.6),transparent 55%);mask-image:linear-gradient(to top,rgba(0,0,0,.6),transparent 55%)}
.tableau .refl svg{width:34%}
.tableau .refl svg.c{width:41%;margin:0 -5%}
.tableau .tag{position:absolute;right:20px;bottom:20px;background:rgba(255,255,255,.85);backdrop-filter:blur(6px);border-radius:14px;padding:10px 14px;font-size:12px;line-height:1.3}
.tableau .tag b{display:block;font-family:var(--display);font-size:20px;font-weight:400}
@media (max-width:900px){.hero{grid-template-columns:1fr;gap:28px}.tableau{aspect-ratio:1/.9}}

/* trust row */
.trust{display:flex;gap:28px;flex-wrap:wrap;font-size:14px;font-weight:600;color:var(--ink-2)}
.trust span{display:inline-flex;align-items:center;gap:8px}
.trust svg{width:16px;height:16px;color:var(--sage)}

/* product grid + cards */
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.grid.three{grid-template-columns:repeat(3,1fr)}
@media (max-width:1000px){.grid,.grid.three{grid-template-columns:repeat(2,1fr)}}
@media (max-width:520px){.grid,.grid.three{grid-template-columns:1fr 1fr;gap:12px}}
.card{position:relative;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:8px;transition:box-shadow .2s,transform .2s;min-width:0}
.card:hover{box-shadow:0 24px 50px -30px rgba(42,26,46,.35);transform:translateY(-2px)}
.card .badge-pos{position:absolute;top:16px;left:16px;z-index:2}
.card .pimg{aspect-ratio:1/1.05;display:flex;align-items:flex-end;justify-content:center;border-radius:14px;background:linear-gradient(180deg,#fff 0%,var(--surface-2) 100%);padding:14px 10px 0;overflow:hidden}
.card .pimg svg{width:62%;transition:transform .3s}
.card:hover .pimg svg{transform:translateY(-4px)}
.card .pimg.group svg{width:42%;margin:0 -7%}
.card .pimg.group svg.c{width:50%;z-index:2}
.card .name{font-weight:600;font-size:16.5px;line-height:1.3}
.card .tag{font-size:14px;color:var(--ink-2)}
.card .price{font-weight:600;font-size:15.5px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.card .price s{color:var(--ink-3);font-weight:400}
.card .save{color:var(--accent);font-weight:700;font-size:13px}
.card ul.inc{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:4px;font-size:13.5px;color:var(--ink-2)}
.card ul.inc li{display:flex;gap:8px;align-items:center}
.card ul.inc svg{width:12px;height:12px;color:var(--sage);flex:none}
.card .cta{margin-top:auto;padding-top:8px}
.card .cta .btn{width:100%}
.stars{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-2)}
.stars .s{display:inline-flex;gap:1px}
.stars svg{width:13px;height:13px}
.stars .cnt{font-style:normal}
@media (max-width:520px){.card .stars .cnt{display:none}}
.quote-card{background:linear-gradient(180deg,#3B2742,#2A1A2E);color:#fff;border-radius:var(--r);padding:24px;display:flex;flex-direction:column;justify-content:flex-end;gap:14px;min-height:100%;position:relative;overflow:hidden}
.quote-card::before{content:"\201C";position:absolute;top:-10px;left:18px;font-family:var(--display);font-size:140px;line-height:1;color:rgba(255,255,255,.08)}
.quote-card p{font-size:17px;line-height:1.45;font-weight:500}
.quote-card b{display:block;font-family:var(--display);font-size:20px;font-weight:400}
.quote-card span{font-size:12.5px;opacity:.75}
.quote-card .orn{position:absolute;right:-30px;top:-30px;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle,rgba(181,72,95,.5),transparent 70%)}

/* panels */
.panel{background:var(--surface);border-radius:28px;padding:clamp(28px,4vw,56px)}
.panel.ink{background:var(--ink);color:#fff}
.quiz-cta{display:grid;grid-template-columns:1fr auto;gap:32px;align-items:center;position:relative;overflow:hidden}
.quiz-cta .art{width:220px;height:220px;flex:none;position:relative}
.quiz-cta .art svg{position:absolute;inset:0}
@media (max-width:760px){.quiz-cta{grid-template-columns:1fr}.quiz-cta .art{display:none}}

/* benefit tiles */
.tiles{display:grid;grid-template-columns:repeat(7,1fr);gap:12px}
@media (max-width:1000px){.tiles{grid-template-columns:repeat(4,1fr)}}
@media (max-width:600px){.tiles{grid-template-columns:repeat(2,1fr)}}
.tile{border-radius:18px;padding:18px 16px;min-height:150px;display:flex;flex-direction:column;justify-content:flex-end;gap:4px;color:#fff;position:relative;overflow:hidden;transition:transform .2s}
.tile:hover{transform:translateY(-3px)}
.tile b{font-family:var(--display);font-size:22px;font-weight:400;line-height:1.05}
.tile span{font-size:12px;opacity:.85}
.tile i{position:absolute;right:-18px;top:-18px;width:90px;height:90px;border-radius:50%;background:rgba(255,255,255,.18)}

/* pillars */
.pillars{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
@media (max-width:900px){.pillars{grid-template-columns:repeat(2,1fr)}}
.pillar{border:1px solid var(--line);border-radius:var(--r);padding:26px 24px;background:#fff;display:flex;flex-direction:column;gap:12px}
.pillar .ico{width:44px;height:44px;border-radius:12px;background:var(--surface);display:flex;align-items:center;justify-content:center}
.pillar .ico svg{width:22px;height:22px}
.pillar b{font-family:var(--display);font-size:24px;font-weight:400}
.pillar p{color:var(--ink-2);font-size:14.5px}

/* story */
.story{display:grid;grid-template-columns:1fr 1fr;border-radius:28px;overflow:hidden;background:var(--surface)}
.story .txt{padding:clamp(28px,4vw,56px);display:flex;flex-direction:column;gap:18px}
.story .txt p{color:var(--ink-2);max-width:52ch}
.story .art{position:relative;min-height:420px;background:radial-gradient(90% 70% at 70% 30%,#F1D4DA,#F7EEEE 60%,#EFE3E8);display:flex;align-items:flex-end;justify-content:center;overflow:hidden}
.story .art svg{width:46%;margin-bottom:-6%;filter:drop-shadow(0 24px 30px rgba(42,26,46,.2))}
.story .art .ring{position:absolute;width:520px;height:520px;border-radius:50%;border:1px solid rgba(42,26,46,.12);left:50%;top:50%;transform:translate(-50%,-40%)}
.story .art .ring.s{width:360px;height:360px}
@media (max-width:860px){.story{grid-template-columns:1fr}.story .art{min-height:320px}}
.sig{display:flex;align-items:center;gap:14px;padding-top:14px;border-top:1px solid var(--line)}
.sig .av{width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,#B5485F,#5C3A6E);display:flex;align-items:center;justify-content:center;color:#fff;font-family:var(--display);font-size:20px}
.sig b{display:block;font-weight:600}
.sig span{font-size:12.5px;color:var(--accent);font-weight:700;letter-spacing:.08em;text-transform:uppercase}

/* reviews */
.rev-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
@media (max-width:860px){.rev-grid{grid-template-columns:1fr}}
.rev{border:1px solid var(--line);border-radius:var(--r);padding:22px;background:#fff;display:flex;flex-direction:column;gap:10px}
.rev b{font-weight:600}
.rev p{color:var(--ink-2);font-size:15px}
.rev .who{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--ink-2);margin-top:auto;padding-top:8px}
.verified{display:inline-flex;align-items:center;gap:4px;color:var(--sage);font-weight:600}
.verified svg{width:13px;height:13px}

/* faq */
.faq{display:grid;grid-template-columns:1fr 1.4fr;gap:40px}
@media (max-width:860px){.faq{grid-template-columns:1fr}}
.acc{border-top:1px solid var(--line)}
.acc:last-child{border-bottom:1px solid var(--line)}
.acc>button{width:100%;display:flex;justify-content:space-between;align-items:center;gap:16px;padding:18px 0;font-size:18px;font-weight:500}
.acc>button .pl{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--ink);display:inline-flex;align-items:center;justify-content:center;flex:none;position:relative}
.acc>button .pl::before,.acc>button .pl::after{content:"";position:absolute;background:var(--ink);width:10px;height:1.5px}
.acc>button .pl::after{transform:rotate(90deg);transition:transform .2s}
.acc.open>button .pl::after{transform:rotate(0)}
.acc .body{display:none;padding:0 0 20px;color:var(--ink-2);max-width:68ch}
.acc.open .body{display:block}
.acc.serif>button{font-family:var(--display);font-size:22px;font-weight:400}

/* footer */
.ftr{background:var(--ink);color:#fff;margin-top:40px}
.ftr-in{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:32px;padding-block:56px 32px}
@media (max-width:860px){.ftr-in{grid-template-columns:1fr 1fr}}
@media (max-width:520px){.ftr-in{grid-template-columns:1fr}}
.ftr h4{margin:0 0 14px;font-size:12px;letter-spacing:.16em;text-transform:uppercase;opacity:.65;font-weight:600}
.ftr a{display:block;padding:5px 0;opacity:.9;font-size:15px}
.ftr a:hover{opacity:1;text-decoration:underline}
.ftr .logo{color:#fff;margin-bottom:12px}
.ftr .logo em{color:#E9A3B3}
.news{display:flex;border:1px solid rgba(255,255,255,.3);border-radius:999px;overflow:hidden;max-width:380px;margin-top:14px}
.news input{flex:1;background:transparent;border:0;color:#fff;padding:0 18px;height:48px;min-width:0}
.news input::placeholder{color:rgba(255,255,255,.55)}
.news button{padding:0 18px;background:#fff;color:var(--ink);font-weight:700;font-size:12px;letter-spacing:.1em;text-transform:uppercase}
.legal{border-top:1px solid rgba(255,255,255,.14);padding-block:24px 36px;font-size:12.5px;opacity:.75;display:flex;flex-direction:column;gap:14px}
.legal .box{border:1px solid rgba(255,255,255,.3);border-radius:10px;padding:14px 16px}

/* shop page */
.page-hero{background:var(--surface);border-radius:28px;padding:clamp(28px,4vw,56px);display:grid;grid-template-columns:1fr auto;gap:24px;align-items:end;margin-top:24px}
@media (max-width:760px){.page-hero{grid-template-columns:1fr}}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:28px 0 24px}
.chip{height:38px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:#fff;font-size:14px;font-weight:500;display:inline-flex;align-items:center}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.crumbs{font-size:13px;color:var(--ink-2);padding:22px 0 10px;display:flex;gap:8px;flex-wrap:wrap}
.crumbs a:hover{text-decoration:underline}

/* PDP */
.pdp{display:grid;grid-template-columns:1.08fr 1fr;gap:48px;align-items:start}
@media (max-width:900px){.pdp{grid-template-columns:1fr;gap:28px}}
.gallery{display:grid;grid-template-columns:76px 1fr;gap:14px;position:sticky;top:calc(96px + env(safe-area-inset-top,0px))}
@media (max-width:900px){.gallery{position:static;grid-template-columns:1fr;grid-template-rows:auto auto}.gallery .thumbs{order:2;flex-direction:row}}
.thumbs{display:flex;flex-direction:column;gap:10px}
.thumb{width:76px;height:76px;border-radius:12px;border:1.5px solid var(--line);background:#fff;overflow:hidden;display:flex;align-items:center;justify-content:center;flex:none}
.thumb.on{border-color:var(--ink)}
.thumb svg{height:84%;width:auto}

  const upsellP=PRODUCTS.find(p=>!cart.some(l=>l.type==='product'&&l.id===p.id)&&p.badge==='Bestseller');
  $('#drawer').innerHTML=`<div class="dh"><h3>Your cart <span class="muted" style="font-family:var(--body);font-size:14px">(${n})</span></h3><button class="icon-btn" data-act="close-cart" aria-label="Close">${ICON.x}</button></div>
  <div class="db">${n?`<div class="ship">${left>0?`You are <b>${money(left)}</b> away from free shipping`:`<b style="color:var(--sage)">You have unlocked free shipping</b>`}<i><b style="width:${pct}%"></b></i></div>`:''}
  ${n?cart.map((l,i)=>{const o=lineInfo(l);return `<div class="line">${o.img}<div><b>${o.name}</b><small>${o.sub}</small><div style="display:flex;align-items:center"><span class="q"><button data-act="qty" data-i="${i}" data-d="-1" aria-label="Decrease">−</button><span>${l.qty}</span><button data-act="qty" data-i="${i}" data-d="1" aria-label="Increase">+</button></span><button class="rm" data-act="remove" data-i="${i}">Remove</button></div></div><div class="pr">${o.price<o.base?`<s>${money(o.base*l.qty)}</s>`:''}${money(o.price*l.qty)}</div></div>`}).join(''):`<div class="empty"><div style="width:80px;color:var(--ink-3)">${ICON.bag}</div><h3>Your cart is empty</h3><p>Add a bestseller or build a bundle and save up to 30%.</p><a class="btn" href="#shop" data-act="close-cart">Shop bestsellers</a></div>`}
  ${n&&upsellP?`<div class="upsell"><div class="mini">${bottle(upsellP)}</div><div><b>Pair it with ${upsellP.lines.join(' ')}</b><br><span class="muted">${upsellP.tag}* · ${money(upsellP.price)}</span></div><button data-act="add" data-id="${upsellP.id}" data-tier="1" data-sub="0">Add</button></div>`:''}</div>

/* ================= ROUTER ================= */
function route(){
  const h=(location.hash||'#home').slice(1);
  let html;
  if(h.startsWith('p-'))html=pageProduct(h.slice(2));
  else if(h.startsWith('b-'))html=pageBundle(h.slice(2));
  else if(h.startsWith('shop-'))html=pageShop(h.slice(5));
  else if(h==='shop')html=pageShop();
  else if(h==='bundles')html=pageBundles();
  else if(h==='build')html=pageBuild();
  else if(h==='science')html=pageScience();
  else if(h==='story')html=pageStory();
  else if(h==='faq')html=pageFAQ();
  else if(h==='support')html=pageSupport();
  else html=pageHome();
  $('#main').innerHTML=html;
  closeAll();
  window.scrollTo({top:0,behavior:'instant'});
}
window.addEventListener('hashchange',route);

/* ================= EVENTS ================= */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]'); if(!el)return;
  const act=el.dataset.act;
  if(act==='add'){e.preventDefault();addLine({type:'product',id:el.dataset.id,qty:1,tier:+(el.dataset.tier||1),sub:el.dataset.sub==='1'});}
  else if(act==='addb'){e.preventDefault();addLine({type:'bundle',id:el.dataset.id,qty:1,sub:el.dataset.sub==='1'});$('#modal').classList.remove('on');}
  else if(act==='tier'){pdp.tier=+el.dataset.n;const p=P(location.hash.slice(3));$('#buybox').innerHTML=buyBox(p);}
  else if(act==='freq'){pdp.sub=el.dataset.sub==='1';const p=P(location.hash.slice(3));$('#buybox').innerHTML=buyBox(p);}
  else if(act==='bfreq'){pdp.sub=el.dataset.sub==='1';const b=B(location.hash.slice(3));$('#buybox').innerHTML=bundleBuy(b);}
  else if(act==='thumb'){document.querySelectorAll('.thumb').forEach(t=>t.classList.toggle('on',t===el));document.querySelectorAll('.slide').forEach(s=>s.classList.toggle('on',s.dataset.slide===el.dataset.i));}
  else if(act==='acc'){el.parentElement.classList.toggle('open');}
  else if(act==='cart'){renderCart();openCart();}
  else if(act==='close-cart'){$('#drawer').classList.remove('on');$('#scrim').classList.remove('on');}
  else if(act==='qty'){const l=cart[+el.dataset.i];l.qty+=+el.dataset.d;if(l.qty<1)cart.splice(+el.dataset.i,1);saveCart();renderCart();}
  else if(act==='remove'){cart.splice(+el.dataset.i,1);saveCart();renderCart();}
  else if(act==='checkout'){checkoutModal();}
  else if(act==='search'){renderSearch('');$('#search').classList.add('on');$('#scrim').classList.add('on');}
  else if(act==='close-search'){$('#search').classList.remove('on');$('#scrim').classList.remove('on');}
  else if(act==='menu'){$('#mnav').classList.add('open');}
  else if(act==='menu-close'){$('#mnav').classList.remove('open');}
  else if(act==='close-modal'){$('#modal').classList.remove('on');}
  else if(act==='quiz'){quiz={step:0,a:[]};renderQuiz();$('#mnav').classList.remove('open');}
  else if(act==='quiz-a'){quiz.a.push(el.dataset.v);quiz.step++;renderQuiz();}
  else if(act==='account'){toast('Account sign-in connects at launch');}
  else if(act==='build-toggle'){const id=el.dataset.id;build=build.includes(id)?build.filter(x=>x!==id):[...build,id];el.classList.toggle('on');el.querySelector('.chk').innerHTML=build.includes(id)?ICON.check:'';$('#bsum').innerHTML=buildSummary();}
  else if(act==='build-add'){if(build.length<2)return;addLine({type:'custom',ids:[...build],qty:1});build=[];$('#main').innerHTML=pageBuild();}
  else if(act==='copy'){const v=el.dataset.v;(navigator.clipboard&&navigator.clipboard.writeText?navigator.clipboard.writeText(v):Promise.reject()).then(()=>toast('Copied'),()=>{const r=document.createRange();r.selectNodeContents(el.previousElementSibling);const s=getSelection();s.removeAllRanges();s.addRange(r);toast('Select and copy the address')});}
});
document.addEventListener('submit',e=>{const f=e.target.closest('[data-act="news"]');if(f){e.preventDefault();const v=$('#news-email').value;if(v){toast('Welcome. Your 10% code is on its way');$('#news-email').value='';}}});
document.addEventListener('input',e=>{if(e.target.id==='sq')renderSearch(e.target.value)});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeAll();if((e.key==='Enter'||e.key===' ')&&e.target.matches('.opt')){e.preventDefault();e.target.click();}});
$('#scrim').addEventListener('click',closeAll);

renderHeader();renderFooter();renderCart();route();
</script>
